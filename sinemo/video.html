<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06142b">
<title>Sinema Plus</title>
<link rel="stylesheet" href="style.css?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="sinemo-192.png">
</head>
<body class="halaman-video">

<header class="topbar video-atas">
  <button class="kembali" id="btnKembali" aria-label="Kembali"><svg class="ik" viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button>
  <div class="video-judul"><b id="vJudul">Memuat video...</b><span id="vLabel"></span></div>
  <button id="vFav" class="bintang" aria-label="Favorit"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
</header>

<main class="video-isi">
  <div class="video-layar">
    <video id="vVideo" playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture oncontextmenu="return false"></video>
    <button class="video-tutup" id="vTutup" aria-label="Putar video"><span class="video-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><span class="video-teks" id="vTeks">Ketuk untuk memutar</span></button>
    <button class="suara-btn" id="vSuara" hidden><svg class="ik" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Ketuk untuk nyalain suara</button>
  </div>
</main>

<div id="toast"></div>
<script src="iklan.js?v=6"></script>
<script>
/* ===== SINEMA PLUS · HALAMAN VIDEO ===== */
const API = "https://hidden-lab-7352.rayyanurfitri1299.workers.dev";   // harus sama dengan alamat Worker di app.js

const $ = s => document.querySelector(s);
const baca = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const simpan = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
function toast(t) {
  const e = $("#toast");
  e.textContent = t;
  e.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.classList.remove("show"), 2600);
}

const id = new URLSearchParams(location.search).get("id") || "";
const vVideo = $("#vVideo"), vTutup = $("#vTutup"), vSuara = $("#vSuara"), vFav = $("#vFav");

/* cari video dari daftar (pakai simpanan dulu biar cepat, lalu ambil terbaru dari Worker) */
function cari(j) {
  if (!j) return null;
  const n = id.slice(1);
  if (id[0] === "g") { const x = (j.gratis || []).find(v => String(v.id) === n); if (x) return { ...x, eks: false }; }
  if (id[0] === "e") { const x = (j.eksklusif || []).find(v => String(v.id) === n); if (x) return { ...x, eks: true }; }
  return null;
}
function tampil(v) {
  $("#vJudul").textContent = v.judul || (v.eks ? "Video Eksklusif" : "Video");
  $("#vLabel").textContent = v.eks ? "EKSKLUSIF" : "SINEMA PLUS";
  document.title = (v.judul || "Video") + " — Sinema Plus";
  if (v.thumb) vVideo.poster = v.thumb;
  if (!v.src) return;
  if (vVideo.getAttribute("src") !== v.src) vVideo.src = v.src;
}
/* tampilkan gambar awal video (biar tidak hitam sebelum diputar) */
/* layar video ikut bentuk video (tegak / mendatar), tanpa pinggiran hitam */
function pasLayar() {
  const w = vVideo.videoWidth, h = vVideo.videoHeight;
  if (!w || !h) return;
  const isi = $(".video-isi");
  const W = Math.min(isi.clientWidth - 32, 720), H = isi.clientHeight - 32;
  const k = Math.min(W / w, H / h);
  vVideo.style.aspectRatio = w + " / " + h;
  vVideo.style.maxHeight = "none";
  $(".video-layar").style.width = Math.floor(w * k) + "px";
}
window.addEventListener("resize", pasLayar);
vVideo.addEventListener("loadedmetadata", () => {
  pasLayar();
  if (vVideo.paused && !vVideo.currentTime) { try { vVideo.currentTime = 0.1; } catch (e) {} }
});
/* 1) video yang dibawa dari daftar (paling cepat & pasti) */
let ketemu = null;
try {
  const bawa = JSON.parse(sessionStorage.getItem("sp_putar") || "null");
  if (bawa && bawa.id === id && bawa.src) ketemu = bawa;
} catch (e) {}
/* 2) link video dari alamat halaman */
const linkAlamat = new URLSearchParams(location.search).get("v");
if (!ketemu && linkAlamat) ketemu = { id, judul: "", src: linkAlamat, thumb: "", eks: id[0] === "e" };
/* 3) simpanan daftar video */
if (!ketemu) ketemu = cari(baca("sp_video", null));
if (ketemu) tampil(ketemu);
fetch(API + "/api/video").then(r => r.json()).then(j => {
  simpan("sp_video", j);
  const v = cari(j);
  if (v) { ketemu = v; if (!vVideo.currentTime) tampil(v); }
  else if (!ketemu) { $("#vJudul").textContent = "Video tidak ditemukan"; $("#vTeks").textContent = "Video tidak ditemukan"; }
}).catch(() => { if (!ketemu) { $("#vJudul").textContent = "Video gagal dimuat"; $("#vTeks").textContent = "Cek internet lalu buka ulang"; } });

/* video tidak jalan sendiri: penonton pencet play */
vTutup.addEventListener("click", () => {
  if (!vVideo.getAttribute("src")) { toast("Video belum siap"); return; }
  if (typeof iklanPlay === "function" && !iklanPlay()) return;   // atur iklan di iklan.js
  vTutup.hidden = true;
  vVideo.setAttribute("controls", "");
  vVideo.muted = false;
  vVideo.play().catch(() => {
    vVideo.muted = true;
    vVideo.play().then(() => { vSuara.hidden = false; }).catch(() => { vTutup.hidden = false; vVideo.removeAttribute("controls"); });
  });
});
vSuara.addEventListener("click", () => { vVideo.muted = false; vSuara.hidden = true; vVideo.play().catch(() => {}); });
vVideo.addEventListener("volumechange", () => { if (!vVideo.muted) vSuara.hidden = true; });
vVideo.addEventListener("error", () => { if (vVideo.getAttribute("src")) toast("Video gagal diputar. Coba lagi sebentar."); });

/* favorit (sama dengan bintang di daftar video) */
const favs = () => baca("sp_fav", []);
vFav.classList.toggle("on", favs().includes(id));
vFav.addEventListener("click", () => {
  const f = favs(), i = f.indexOf(id);
  if (i > -1) f.splice(i, 1); else f.unshift(id);
  simpan("sp_fav", f);
  vFav.classList.toggle("on", i === -1);
  toast(i === -1 ? "Ditambahkan ke favorit" : "Dihapus dari favorit");
});

/* tombol kembali: balik ke daftar video */
$("#btnKembali").addEventListener("click", () => {
  let dariSini = false;
  try { dariSini = document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
  if (dariSini && history.length > 1) history.back(); else location.href = "./";
});
</script>
</body>
</html>
