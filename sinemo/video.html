<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06142b">
<title>Sinema Plus</title>
<link rel="stylesheet" href="style.css?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="sinemo-192.png">
</head>
<body class="halaman-video">

<header class="topbar video-atas">
  <button class="kembali" id="btnKembali" aria-label="Kembali"><svg class="ik" viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button>
  <div class="video-judul"><b id="vJudul">Memuat video...</b><span id="vLabel"></span></div>
  <button id="vFav" class="bintang" aria-label="Favorit"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
</header>

<main class="video-isi">
  <div class="video-layar">
    <video id="vVideo" playsinline preload="metadata" controlslist="nodownload noplaybackrate" disablepictureinpicture oncontextmenu="return false"></video>
    <button class="video-tutup" id="vTutup" aria-label="Putar video"><span class="video-play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><span class="video-teks" id="vTeks">Ketuk untuk memutar</span></button>
    <button class="suara-btn" id="vSuara" hidden><svg class="ik" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Ketuk untuk nyalain suara</button>
  </div>
</main>

<div id="toast"></div>
<script src="iklan.js?v=5"></script>
<script src="video.js?v=2"></script>
</body>
