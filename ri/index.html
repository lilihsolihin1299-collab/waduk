<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASUPAN HARIAN</title>  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .box {
      padding: 25px;
      width: 90%;
      max-width: 400px;
      box-sizing: border-box;
      background: #202020;
      border-radius: 15px;
    }

    h2 {
      color: #ffd700;
    }

    .ad-button {
      display: inline-block;
      padding: 13px 25px;
      background: #ffd700;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    #countdown {
      color: #ffd700;
      font-size: 22px;
      font-weight: bold;
    }
  </style></head><body>
  <div class="box">
    <h2>Silakan Tunggu</h2>
    <p>Anda sedang diarahkan ke halaman tujuan.</p><p>Iklan:</p>

<!-- GANTI DENGAN LINK IKLAN MILIKMU -->
<a class="ad-button"
   href="https://omg10.com/4/11905857"
   target="_blank"
   rel="noopener noreferrer">
  Kunjungi Iklan
</a>

<p>Melanjutkan dalam <span id="countdown">5</span> detik...</p>

  </div>  <script>
    // GANTI DENGAN LINK TUJUAN
    const destination = "https://omg10.com/4/11905857";

    let seconds = 5;
    const countdown = document.getElementById("countdown");

    const timer = setInterval(() => {
      seconds--;
      countdown.textContent = seconds;

      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace(destination);
      }
    }, 1000);
  </script></body>
</html>
