<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spesial Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Plus+Jakarta+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i></i><span class="rb">SPESIAL EDITION</span></div>
    <div class="pill"><span class="dot"></span>Sedang tayang</div>
  </header>

  <section class="hero">
    <div class="eyebrow rb">Streaming 24 jam · 8 saluran</div>
    <div class="stage">
      <a class="player" id="player" target="_blank" rel="noopener">
        <canvas id="fx"></canvas>
        <img class="photo" id="pFoto" alt="" hidden>
        <div class="scan"></div><div class="shade"></div>
        <div class="p-top"><span class="badge live">LIVE</span><span class="badge hd">FULL HD</span></div>
        <div class="bigplay"><span></span></div>
        <div class="p-bot">
          <div class="p-title"><b class="rb" id="pName"></b><small id="pView"></small></div>
          <div class="bar"><i></i></div>
        </div>
      </a>
    </div>
    <div class="ticker"><div id="tick"></div></div>
  </section>

  <section>
    <div class="grid-head"><h2 class="rb">Semua Saluran</h2></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="ctas">
    <a class="cta tg" id="btnTg" target="_blank" rel="noopener">
      <span class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M21.9 4.3 18.8 19c-.2 1-.9 1.3-1.7.8l-4.7-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.8 8.8-7.9c.4-.3-.1-.5-.6-.2L6.7 12.9 2 11.4c-1-.3-1-1 .2-1.5l18.3-7c.9-.3 1.6.2 1.4 1.4z"/></svg></span>
      <span class="txt"><b>Masuk Telegram</b><small>Info saluran baru, jadwal tayang, dan link cadangan</small></span>
      <span class="go">Gabung →</span>
    </a>
    <a class="cta app" id="btnApp" target="_blank" rel="noopener">
      <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12070D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg></span>
      <span class="txt"><b class="rb">Web Aplikasi</b><small>Lebih cepat, bisa simpan saluran favorit</small></span>
      <span class="go">Buka →</span>
    </a>
  </section>

  <footer>© 2026 <span class="rb">SPESIAL EDITION</span></footer>
</div>
<script src="script.js"></script>
</body>
  </html>
