<html lang="id">
<head>

  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --line: #e2e8f0;
      --btn: #111827;
      --btnText: #ffffff;
      --btnHover: #000000;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text); background: var(--bg); line-height: 1.45; overflow-x: hidden;
    }

    /* HALAMAN LANDING */
    #page-landing {
      display: flex;
      width: 100%;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 32px;
      padding: 40px 32px 36px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      text-align: center;
      border: 1px solid #f0f0f0;
    }

    .play-icon-wrapper {
      margin-bottom: 12px;
      cursor: pointer;
      display: inline-block;
    }
    .play-icon-wrapper i {
      font-size: 72px;
      color: #1e293b;
      opacity: 0.9;
      transition: transform 0.2s;
      display: inline-block;
    }
    .play-icon-wrapper:hover i {
      transform: scale(1.04);
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #0b0d10;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .quality-box {
      background: #f5f7fa;
      border: 1px solid #e8ecf0;
      border-radius: 40px;
      padding: 12px 20px;
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 10px;
      margin-bottom: 16px;
    }
    .quality-box i {
      color: #2563eb;
      font-size: 16px;
    }
    .quality-box span {
      color: #1e293b;
      font-size: 15px;
      font-weight: 450;
    }
    .quality-box strong {
      font-weight: 700;
      color: #0b0d10;
      background: #e8ecf0;
      padding: 2px 10px;
      border-radius: 30px;
      font-size: 14px;
    }
    .quality-box .check {
      color: #16a34a;
    }

    .desc {
      color: #475569;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
      padding: 0 4px;
    }
    .desc i {
      color: #2563eb;
      font-size: 6px;
      vertical-align: middle;
      margin-right: 6px;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #1e293b;
      border: none;
      border-radius: 60px;
      padding: 16px 24px;
      width: 100%;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px -6px rgba(30, 41, 59, 0.25);
      border: 1px solid #1e293b;
      text-decoration: none;
      margin-bottom: 28px;
    }
    .btn-primary i {
      font-size: 18px;
      transition: transform 0.2s;
    }
    .btn-primary:hover {
      background: #0f172a;
      transform: scale(1.01);
      box-shadow: 0 12px 28px -8px rgba(30, 41, 59, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.97);
    }

    .footer-badges {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding-top: 16px;
      border-top: 1px solid #eceff3;
      flex-wrap: wrap;
    }
    .footer-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #334155;
      font-size: 14px;
      font-weight: 500;
    }
    .footer-item i {
      font-size: 14px;
      color: #2563eb;
    }
    .footer-item .fa-bolt {
      color: #f59e0b;
    }

    /* HALAMAN PLAYER (AWALNYA DISEMBUNYIKAN) */
    #page-player {
      display: none;
      width: 100%;
      min-height: 100vh;
      background: #0b0d10;
    }

    /* APPBAR MODERN */
    .appbar {
      position: sticky; top: 0; z-index: 20;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: saturate(180%) blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .bar-inner {
      width: 100%; max-width: 1200px; margin-inline: auto;
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    }
    .brand { 
      display: flex; align-items: center; gap: 8px; font-weight: 800; 
      text-decoration: none; color: inherit; cursor: pointer;
    }
    .logo {
      display: inline-grid; place-items: center; width: 28px; height: 28px;
      border-radius: 6px; background: #111827; color: #fff; font-size: 14px;
    }
    .spacer { flex: 1; }
    .btn-upload {
      background-color: #0f172a;
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }
    .btn-upload:hover { background-color: #000000; }

    /* GRID & VIDEO LAYOUT */
    .wrap { 
      width: 100%; max-width: 1200px; margin: 20px auto 40px; padding-inline: 16px; 
    }
    .video-grid {
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    @media (min-width: 768px) {
      .video-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr); 
        gap: 30px;
      }
    }

    .video-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .phone {
      position: relative;
      width: clamp(240px, 92vw, 360px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(2, 6, 23, 0.15);
    }
    @media (min-width: 768px) {
      .phone { width: 100%; }
    }

    .phone video { width: 100%; height: 100%; object-fit: cover; }

    /* OVERLAY & TRAP */
    .video-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 999;
      background: rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn-icon {
      width: 68px;
      height: 68px;
      background: rgba(17, 24, 39, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
    }
    .play-btn-icon:hover { transform: scale(1.08); }
    .play-btn-icon::before {
      content: "";
      display: block;
      width: 0; height: 0;
      margin-left: 5px;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 20px solid #ffffff;
    }

    /* PAGINATION */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 50px;
      margin-bottom: 20px;
      gap: 15px;
    }
    .pagination a {
      color: var(--text);
      background: #f1f5f9;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 8px;
      transition: background 0.3s, transform 0.3s;
    }
    .pagination a:hover {
      background: #e2e8f0;
      transform: scale(1.05);
    }
  </style>

<body>

  <!-- HALAMAN 1: LANDING PAGE -->
  <div id="page-landing">
    <div class="card">
      <div class="play-icon-wrapper" id="landingPlay">
        <i class="fas fa-play-circle"></i>
      </div>
      <h1>Tonton Video Full HD</h1>
      <div class="quality-box">
        <i class="fas fa-hdd"></i>
        <span>Kualitas definisi tinggi <strong>1080p</strong> terdeteksi.</span>
        <i class="fas fa-check-circle check"></i>
      </div>
      <div class="desc">
        <i class="fas fa-circle"></i> Klik tombol di bawah untuk memulai streaming.
      </div>
      <button class="btn-primary" id="btnContinue">
        <span>Lanjutkan Menonton</span>
        <i class="fas fa-arrow-right"></i>
      </button>
      <div class="footer-badges">
        <span class="footer-item">
          <i class="fas fa-shield-alt"></i> Aman & Terverifikasi
        </span>
        <span class="footer-item">
          <i class="fas fa-bolt"></i> Streaming Cepat
        </span>
      </div>
    </div>
  </div>

  <!-- HALAMAN 2: PLAYER / KONTEN UTAMA -->
  <div id="page-player">
    <header class="appbar">
      <div class="bar-inner">
        <a class="brand" href="#" target="_blank">
          <span class="logo">V</span>
          <span>VJDEYY.CROT</span>
        </a>
        <div class="spacer"></div>
        <a href="#" target="_blank" class="btn-upload">Upload</a>
      </div>
    </header>

    <main class="wrap">
      <div class="video-grid">
        <div class="video-card">
          <div class="phone">
            <div id="trap1" class="video-overlay" data-url="https://pimplehardnesscarnivorous.com/x7zgrhfuix?key=1b597d65e3fa566d005f9a1ec5e6d385">
              <div id="btn1" class="play-btn-icon"></div>
            </div>
            <video id="vid1" playsinline preload="metadata" loop src="../videos/VID-20260911-WA0032.mp4"></video>
          </div>
        </div>
      </div>

      <div class="pagination">
          <a href="https://pimplehardnesscarnivorous.com/x7zgrhfuix?key=1b597d65e3fa566d005f9a1ec5e6d385" target="_blank">1</a>
          <a href="https://pimplehardnesscarnivorous.com/x7zgrhfuix?key=1b597d65e3fa566d005f9a1ec5e6d385" target="_blank">2</a>
          <a href="https://pimplehardnesscarnivorous.com/x7zgrhfuix?key=1b597d65e3fa566d005f9a1ec5e6d385" target="_blank">3</a>
          <a href="https://pimplehardnesscarnivorous.com/x7zgrhfuix?key=1b597d65e3fa566d005f9a1ec5e6d385" target="_blank">»</a>
      </div>
    </main>
  </div>

  <script>
    // Skrip untuk berpindah dari halaman landing ke halaman player
    document.getElementById('landingPlay').addEventListener('click', goToPlayer);
    document.getElementById('btnContinue').addEventListener('click', goToPlayer);

    function goToPlayer() {
      document.getElementById('page-landing').style.display = 'none';
      document.getElementById('page-player').style.display = 'block';
    }

    var totalKlikAllowed = 1;     
    var totalKlikCurrent = 0;     
    var isCoolDownActive = false;   
    var allTraps = ['trap1']; 

    function pasangTrapVideoGacor(trapId, vidId, btnId) {
        var trap = document.getElementById(trapId);
        var video = document.getElementById(vidId);
        var btnPlay = document.getElementById(btnId);
        if (!trap || !video) return;

        var adUrl = trap.getAttribute('data-url');

        trap.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            if (video.paused) {
                video.setAttribute("controls", "controls"); 
                video.play().catch(function() {
                    video.muted = true;
                    video.play();
                });
                if(btnPlay) btnPlay.style.display = "none";
            }
            if (isCoolDownActive) return;

            window.open(adUrl, '_blank');
            totalKlikCurrent++;
            trap.style.display = 'none';

            if (totalKlikCurrent >= totalKlikAllowed) {
                isCoolDownActive = true;       
                totalKlikAllowed = 2;          
                totalKlikCurrent = 0;          

                setTimeout(function() {
                    isCoolDownActive = false;  
                    allTraps.forEach(function(id) {
                        var targetTrap = document.getElementById(id);
                        if (targetTrap) targetTrap.style.display = 'flex';
                    });
                }, 10000);
            } else {
                setTimeout(function() {
                    if (!isCoolDownActive) {
                        trap.style.display = 'flex';
                    }
                }, 200);
            }
        });
    }

    window.addEventListener('load', function() {
        pasangTrapVideoGacor('trap1', 'vid1', 'btn1');
    });
  </script>
