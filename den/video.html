<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07061a">
<title>harapan bangsa</title>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body class="halaman-video">
<section class="pemutar" id="halamanVideo" aria-label="Pemutar video">
  <div class="pemutar-atas">
    <button class="kembali" id="btnKembali" aria-label="Kembali ke daftar saluran"><svg viewBox="0 0 24 24"><path d="M15 18 9 12l6-6"/></svg></button>
    <div class="pemutar-judul"><b id="pJudul">Video</b><span id="pKet"></span></div>
  </div>
  <div class="pemutar-isi">
    <div class="layar">
      <video id="pVideo" playsinline preload="metadata" loop controlslist="nodownload noplaybackrate" disablepictureinpicture oncontextmenu="return false"></video>
      <button class="layar-tutup" id="pTutup" aria-label="Putar video"><span class="layar-play"><svg viewBox="0 0 24 24"><path d="M6 3.8c0-.8.9-1.3 1.6-.8l12.1 7.9c.7.5.7 1.5 0 2L7.6 20.8c-.7.5-1.6 0-1.6-.8V3.8Z"/></svg></span><span class="layar-teks" id="pTeks">Ketuk untuk memutar</span></button>
      <button class="suara-btn" id="pSuara" hidden><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Ketuk untuk nyalain suara</button>
    </div>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>
<script src="mon.js?v=9"></script>
<script src="script.js?v=10"></script>
</body>
</html>
